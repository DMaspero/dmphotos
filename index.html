<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography</title>
  <meta name="description" content="A curated selection of photographs: travel, landscape, animals, night sky and people.">
  <meta property="og:title" content="Photography — Davide Maspero">
  <meta property="og:description" content="A curated selection of photographs: travel, landscape, animals, night sky and people.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/web/20250811-_6M28805.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Photography — Davide Maspero">
  <meta name="twitter:description" content="A curated selection of photographs: travel, landscape, animals, night sky and people.">
  <meta name="twitter:image" content="images/web/20250811-_6M28805.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23111'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function(){var t=localStorage.getItem("theme"),d=matchMedia("(prefers-color-scheme:dark)").matches;if(t==="dark"||(!t&&d))document.documentElement.classList.add("dark")})();
  </script>
</head>
<body>

  <header class="site-header">
    <a class="brand" href="#top" id="siteNavTitle">Photography</a>
    <button class="hamburger" id="hamburger" type="button" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav" id="siteNav">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </nav>
  </header>

  <section class="hero" id="top">
    <h1 class="hero-title" id="siteTitle">Selected photographs</h1>
    <div class="hero-featured" id="heroFeatured"></div>
    <a class="hero-cta" href="#gallery">
      View gallery
      <span class="hero-arrow" aria-hidden="true">&darr;</span>
    </a>
  </section>

  <main class="gallery" id="gallery">
    <header class="gallery-head">
      <h2 class="gallery-title" id="galleryTitle">Gallery</h2>

      <button class="back-btn" id="backBtn" type="button" hidden>&larr; Categories</button>

      <div class="cat-nav" aria-label="Filter by category" id="catNav"></div>

      <div class="tag-cloud" id="tagCloud" aria-label="Filter by tag"></div>
    </header>

    <div class="grid" id="grid"></div>

    <p class="empty-note" id="emptyNote" hidden>No photos match the current filter.</p>
  </main>

  <footer class="site-footer">
    <span>&copy; <span id="year"></span> <span id="siteFooter">Photography</span></span>
  </footer>

  <button class="scroll-top" id="scrollTop" type="button" aria-label="Back to top">&uarr;</button>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <div class="lb-backdrop"></div>
    <button class="lb-btn lb-close" type="button" aria-label="Close">&times;</button>
    <button class="lb-btn lb-prev" type="button" aria-label="Previous photo">&larr;</button>
    <div class="lb-content">
      <div class="lb-exif" id="lbExif"></div>
      <figure class="lb-stage">
        <img class="lb-img" src="" alt="" draggable="false">
      </figure>
    </div>
    <div class="lb-like-wrap" id="lbLikeWrap"></div>
    <button class="lb-btn lb-next" type="button" aria-label="Next photo">&rarr;</button>
    <button class="lb-btn lb-zoom" type="button" aria-label="Zoom in">+</button>
    <figcaption class="lb-caption">
      <span class="lb-meta"></span>
      <span class="lb-tags" id="lbTags"></span>
    </figcaption>
    <div class="lb-hints" id="lbHints">
      <span>&larr; &rarr; navigate</span>
      <span>+ &minus; zoom</span>
      <span>esc close</span>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyCRMfxwEkGheaabxGZoYJCS8j31vlhgdjM",
      authDomain: "photosite-322bd.firebaseapp.com",
      databaseURL: "https://photosite-322bd-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "photosite-322bd",
      storageBucket: "photosite-322bd.firebasestorage.app",
      messagingSenderId: "578759457925",
      appId: "1:578759457925:web:7235693bc5abf122773dec"
    });
  </script>
  <script src="js/site.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
